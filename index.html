<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="LYVO — твоя система личного развития">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>LYVO</title>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="LYVO — главная"><span class="brand-mark">L</span><span>LYVO</span></a>
      <div class="side-label">ТВОЁ ПРОСТРАНСТВО</div>
      <nav class="nav" aria-label="Основная навигация">
        <button class="nav-item active" data-page="home"><span class="nav-icon">◫</span> Обзор</button>
        <button class="nav-item" data-page="rhythms"><span class="nav-icon">↻</span> Ритмы</button>
        <button class="nav-item" data-page="tasks"><span class="nav-icon">✓</span> Задания</button>
        <button class="nav-item" data-page="goals"><span class="nav-icon">◎</span> Цели</button>
        <button class="nav-item" data-page="notes"><span class="nav-icon">▤</span> Заметки</button>
        <button class="nav-item" data-page="graph"><span class="nav-icon">⌁</span> График</button>
      </nav>
      <div class="sidebar-bottom"><div class="profile-dot" id="profileDot">?</div><div class="profile-copy"><strong id="sideName">Твой профиль</strong><span>Твой путь · твой темп</span></div><button class="icon-button" data-action="settings" aria-label="Настройки">⚙</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div class="mobile-brand"><span class="brand-mark">L</span> LYVO</div><div class="topbar-date" id="todayLabel"></div><button class="top-profile" data-action="settings" aria-label="Настройки профиля"><span id="topInitial">?</span></button></header>
      <section id="pageContent" class="page-content" aria-live="polite"></section>
      <nav class="mobile-nav" aria-label="Навигация"><button class="active" data-page="home"><span>◫</span>Обзор</button><button data-page="rhythms"><span>↻</span>Ритмы</button><button data-page="tasks"><span>✓</span>Задания</button><button data-page="goals"><span>◎</span>Цели</button><button data-page="notes"><span>▤</span>Заметки</button></nav>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
